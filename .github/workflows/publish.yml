name: Publish Package to npm

# This tells GitHub WHEN to run this script.
# We are telling it to run every time you push to the "main" branch.
on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest # A fresh Linux machine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This is the magic step. It installs Node and creates a temporary,
      # perfectly formatted .npmrc file using your GitHub secret.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Build the TypeScript code
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          # This pulls the token from GitHub Secrets and feeds it to npm
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
